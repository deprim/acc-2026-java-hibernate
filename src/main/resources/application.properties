spring.application.name=hibernate-practical

# In real project I would store URL in .env file
# I changed in memory to file
spring.datasource.url=jdbc:h2:file:./data/librarydb
spring.datasource.driverClassName=org.h2.Driver

# In real project I would store credentials in .env file
spring.datasource.username=sa
spring.datasource.password=verystrongpassword

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true